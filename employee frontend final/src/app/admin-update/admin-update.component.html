<section class="vh-100">
    <div class="container-fluid h-custom">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-md-9 col-lg-6 col-xl-5">
                <img src="../assets/noBgLogin.png" class="img-fluid" alt="Sample image">
            </div>
            <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
                <form (ngSubmit)="updateAdmin()">
                    <!-- Admin Update Form Content -->
                    <!-- You can include input fields to update admin information here -->
                    <div class="form-outline mb-4">
                        <input type="text" id="adminName" class="form-control form-control-lg" placeholder="Enter admin name" />
                        <label class="form-label" for="adminName">Admin Name</label>
                    </div>
                    <div class="form-outline mb-4">
                        <input type="text" id="adminEmail" class="form-control form-control-lg" placeholder="Enter admin Email" />
                        <label class="form-label" for="Email">Admin Email</label>
                    </div>
                    <div class="form-outline mb-4">
                        <input type="text" id="adminPassword" class="form-control form-control-lg" placeholder="Enter admin password" />
                        <label class="form-label" for="Password">&nbsp;&nbsp;&nbsp;Admin 
                            Password</label>
                    </div>
                    <!-- Other input fields for admin update -->

                    <div class="text-center text-lg-start mt-4 pt-2">
                        <!-- Bind form submission to updateAdmin method -->
                        <button type="submit" class="btn btn-dark btn-lg" style="padding-left: 2.5rem; padding-right: 2.5rem;">Update Admin</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
